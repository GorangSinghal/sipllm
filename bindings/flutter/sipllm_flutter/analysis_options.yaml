include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # FFI struct field getters/setters are `external`; keep public members undocumented-friendly.
    public_member_api_docs: ignore

linter:
  rules:
    prefer_final_locals: true
    avoid_print: true
    unawaited_futures: true
